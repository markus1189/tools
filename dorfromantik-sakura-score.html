        };
        const isFinal = (key) => state.finalFields.includes(key);
        const sumSection = (section) => activeFields(section).reduce((a, f) => a + fieldTotal(f, state.fields[f.key]), 0);
        const sumCustom = () => state.custom.reduce((a, c) => a + num(c.points), 0);
        const sumAll = () => SECTIONS.reduce((a, s) => a + sumSection(s), 0) + sumCustom();

        // ── Export ───────────────────────────────────────────────
        function buildExport() {
            const { meta, fields, custom } = state;
            const lines = [];
            const d = new Date().toLocaleDateString('de-DE');
            lines.push(`Dorfromantik: Sakura – Wertung${meta.partie ? ` · Partie ${meta.partie}` : ''} · ${d}`);
            if (meta.spieler) lines.push(`Mitspieler: ${meta.spieler}`);
            lines.push('');
            SECTIONS.forEach((s) => {
                const st = sumSection(s);
                if (st === 0) return;
                lines.push(`${s.title}: ${st}`);
                activeFields(s).forEach((f) => {
                    const v = fields[f.key];
                    const ft = fieldTotal(f, v);
                    if (ft === 0) return;
                    let detail = '';
                    if (f.kind === 'tally' && v.length > 1) detail = ` (${v.join('+')})`;
                    if (f.derived) detail = ` (${flagAreaCount()} Fahnengebiete×${f.mult})`;
                    else if (f.kind === 'count' && (f.mult || 1) > 1) detail = ` (${num(v)}×${f.mult})`;
                    lines.push(`  ${f.emoji} ${f.label}: ${ft}${detail}`);
                });
            });
            const cs = sumCustom();
            if (cs !== 0) {
                lines.push(`Sonstiges: ${cs}`);
                custom.forEach((c) => {
                    if (num(c.points)) lines.push(`  🎁 ${c.label || 'Feld'}: ${num(c.points)}`);
                });
            }
            const fmt = (t) => `${TYPE_BY_KEY[t.type].emoji}${t.value}`;
            if (state.completedTasks.length > 0) {
                lines.push(`Erledigt (${state.completedTasks.length}): ${state.completedTasks.map(fmt).join(' · ')}`);
            }
            if (state.failedTasks.length > 0) {
                lines.push(`Gescheitert: ${state.failedTasks.map(fmt).join(' · ')}`);
            }
            lines.push('');
            const total = sumAll();
            lines.push(`Gesamt: ${total} Punkte 🌸 → ${crossesFor(total)} Kreuze auf dem Kampagnenpfad`);
            return lines.join('\n');
        }

        // ── Rendering ────────────────────────────────────────────
        const $ = (sel, root = document) => root.querySelector(sel);
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const cssColor = (v) => `var(${v})`;
        const typeBg = (t) => t.bg || cssColor(t.cssVar);

        function hexChip(item) {
            return `<span class="hex-chip" aria-hidden="true" style="--c:${cssColor(item.cssVar)}">${glyph(item)}</span>`;
        }

        function renderHeader() {
            $('#title').textContent = state.meta.partie ? `Partie ${state.meta.partie}` : 'Wertungskarte';
            $('#kicker').textContent = `Sakura · ${unlocks.length}/${ALL_UNLOCK_KEYS.length} freigespielt`;
            document.documentElement.dataset.theme = uiState.theme;
            $('meta[name="theme-color"]').content = uiState.theme === 'papier' ? '#F4ECE1' : '#140E11';
            $('#menuThemeLabel').textContent = uiState.theme === 'papier' ? 'Nacht-Thema' : 'Papier-Thema';
        }

        function renderHero() {
            const total = sumAll();
            $('#totalNum').textContent = total;
            const c = crossInfo(total);
            $('#crossBox').innerHTML = c.max
                ? `<div class="cross-head"><span><b>${c.n}</b> Kreuze</span><span class="next">Maximum</span></div>
                   <div class="bar"><span style="width:100%"></span></div>`
                : `<div class="cross-head"><span><b>${c.n}</b> ${c.n === 1 ? 'Kreuz' : 'Kreuze'}</span><span class="next">${c.nextN}. bei ${c.nextMin}</span></div>
                   <div class="bar" role="progressbar" aria-label="Fortschritt zum nächsten Kreuz" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(c.pct * 100)}"><span style="width:${Math.round(c.pct * 100)}%"></span></div>
                   <div class="cross-need">noch ${c.need} ${c.need === 1 ? 'Punkt' : 'Punkte'}</div>`;
        }

        function renderTabs() {
            TABS.forEach((t) => {
                const on = uiState.tab === t;
                const tab = $(`#tab-${t}`);
                tab.setAttribute('aria-selected', String(on));
                tab.tabIndex = on ? 0 : -1;
                $(`#pane-${t}`).hidden = !on;
            });
            // Freie Slots als Hinweis am Aufträge-Tab, solange man woanders ist
            const free = taskLimit() - state.openTasks.length;
            const tab = $('#tab-auftraege');
            tab.innerHTML = `Aufträge${free > 0 && uiState.tab !== 'auftraege' ? `<span class="badge" aria-label="${free} frei">${free}</span>` : ''}`;
        }

        function remainingFor(typ) {
            return allocateSupply(typ.supply, consumedMarkers(typ.key)).remaining;
        }

        function renderTracker() {
            const tasks = state.openTasks;
            const limit = taskLimit();
            const free = limit - tasks.length;
            const fujiBtn = isUnlocked('fujiyama')
                ? `<button class="fuji-btn" data-action="toggle-fuji" aria-pressed="${state.fuji}">${ui('fuji')}Fujiyama</button>`
                : '';
            let html = `
                <div class="pane-head">
                    <h2>Offene Aufträge <span>${tasks.length}/${limit}</span></h2>
                    ${fujiBtn}
                </div>
                <div class="slots${limit === 4 ? ' four' : ''}" style="--slots:${limit}">`;
            tasks.forEach((t) => {
                const typ = TYPE_BY_KEY[t.type];
                const name = esc(typ.short || typ.label);
                html += `
                    <article class="task-card" style="--c:${cssColor(typ.cssVar)};--bgc:${typeBg(typ)}">
                        <span class="task-hex">${typ.seven ? '' : glyph(typ, { color: 'var(--ink)', flat: true })}<span class="num">${t.value}</span></span>
                        <span class="task-name">${typ.seven ? '7 ' : ''}${name}</span>
                        <button class="done-btn" data-action="complete" data-id="${t.id}" aria-label="${esc(typ.label)} ${t.value} erledigt">${ui('check', ' style="stroke-width:2.6"')}<span class="done-label">Erledigt</span></button>
                        <div class="task-actions">
                            <button class="fail" data-action="fail" data-id="${t.id}" aria-label="${esc(typ.label)} ${t.value} gescheitert">${ui('x')}</button>
                            <button data-action="remove-task" data-id="${t.id}" aria-label="${esc(typ.label)} ${t.value} zurück in den Vorrat">${ui('undo')}</button>
                        </div>
                    </article>`;
            });
            for (let i = 0; i < free; i++) {
                html += `
                    <button class="new-slot" data-action="open-composer" aria-expanded="${composerOpen}" aria-controls="composer">
                        <svg viewBox="0 0 44 50" aria-hidden="true"><path d="M22 2 41 13v24L22 48 3 37V13z"/><path d="M22 15v20M12 25h20" stroke-width="3.6"/></svg>
                        Neuer<br>Auftrag
                    </button>`;
            }
            html += '</div>';

            if (composerOpen && free > 0) html += composerHtml();

            if (tasks.length + state.completedTasks.length + state.failedTasks.length === 0) {
                html += '<p class="hint" style="margin-top:12px">„Neuer Auftrag“ antippen, Landschaft und Markerwert wählen. „Erledigt“ trägt die Punkte automatisch in die Wertung ein.</p>';
            }

            const hidden = hiddenMarkerCount();
            html += `
                <button class="stats-link" data-action="tab" data-tab="vorrat">
                    <span><span class="ok">${state.completedTasks.length} erledigt</span> · <span class="bad">${state.failedTasks.length} gescheitert</span> · ${hidden} verdeckt</span>
                    <span class="go">Vorrat${ui('right')}</span>
                </button>`;
            $('#pane-auftraege').innerHTML = html;
        }

        function composerHtml() {
            const types = TASK_TYPES.filter(typeOn);
            const typeBtn = (t) => {
                const sel = pickType === t.key;
                const empty = Object.values(remainingFor(t)).every((n) => n <= 0);
                const inner = t.seven
                    ? `<span class="split-hex" style="--g:${t.bg}">7</span>${esc(t.short)}`
                    : glyph(t, sel ? { color: 'var(--ink)', flat: true } : {});
                return `<button class="type-btn${t.seven ? ' seven-btn' : ''}" style="--c:${cssColor(t.cssVar)}" data-action="pick-type" data-type="${t.key}" aria-pressed="${sel}" aria-label="${t.seven ? '7er ' : ''}${esc(t.label)}${empty ? ' – aufgebraucht' : ''}"${empty ? ' disabled' : ''}>${inner}</button>`;
            };
            let html = `
                <section class="card composer" id="composer" aria-label="Neuen Auftrag anlegen">
                    <span class="label-caps">1 · Landschaft</span>
                    <div class="type-grid">${types.filter((t) => !t.seven).map(typeBtn).join('')}</div>`;
            const sevens = types.filter((t) => t.seven);
            if (sevens.length > 0) html += `<div class="seven-grid">${sevens.map(typeBtn).join('')}</div>`;
            if (pickType) {
                const typ = TYPE_BY_KEY[pickType];
                const remaining = remainingFor(typ);
                html += `
                    <span class="label-caps">2 · Markerwert <span style="color:var(--text);text-transform:none;letter-spacing:0">— ${esc(typ.label)}</span></span>
                    <div class="value-grid" style="--n:${typ.chips.length}">
                        ${typ.chips.map((v) => {
                            const left = remaining[v] || 0;
                            return `<button class="value-btn" style="--c:${left > 0 ? cssColor(typ.cssVar) : 'var(--line)'}" data-action="add-task" data-value="${v}"${left > 0 ? '' : ' disabled'}>
                                <span class="num">${v}</span><small>${left > 0 ? `noch ${left}` : 'aufgebraucht'}</small></button>`;
                        }).join('')}
                    </div>`;
                if (!typ.seven) {
                    html += `
                    <div class="other-row">
                        <label for="taskOther">Anderer Wert</label>
                        <input id="taskOther" class="num-input" type="number" inputmode="numeric" placeholder="z. B. 8" data-role="task-value">
                        <button class="sq-btn" data-action="task-custom-add" aria-label="Wert übernehmen">${ui('plus')}</button>
                    </div>`;
                }
            } else {
                html += '<p class="hint">Erst Landschaft wählen, dann Markerwert.</p>';
            }
            return html + '</section>';
        }

        // Vorrat: je Typ eine Zeile, je Markerwert eine Spalte, je Marker ein Hex
        function supplyLanes() {
            const extras = [];
            const lanes = TASK_TYPES.filter(typeOn).map((typ) => {
                const slots = {};
                typ.supply.forEach((v) => (slots[v] = slots[v] || []).push(null));
                const place = (v, cell) => {
                    const i = slots[v] ? slots[v].indexOf(null) : -1;
                    if (i >= 0) slots[v][i] = cell;
                    return i >= 0;
                };
                // Wertungseinträge ohne erledigten Auftrag = manuell eingetragen
                const manual = {};
                state.fields[typ.key].forEach((v) => (manual[v] = (manual[v] || 0) + 1));
                state.completedTasks.filter((t) => t.type === typ.key).forEach((t) => {
                    manual[t.value] = (manual[t.value] || 0) - 1;
                    if (!place(t.value, 'done')) extras.push({ kind: 'done', task: t });
                });
                Object.entries(manual).forEach(([v, n]) => {
                    for (let i = 0; i < n; i++) place(Number(v), 'done');
                });
                state.openTasks.filter((t) => t.type === typ.key).forEach((t) => place(t.value, 'open'));
                state.failedTasks.filter((t) => t.type === typ.key).forEach((t) => {
                    if (!place(t.value, 'failed')) extras.push({ kind: 'failed', task: t });
                });
                const hidden = Object.values(slots).flat().filter((c) => c === null).length;
                return { typ, slots, hidden };
            });
            return { lanes, extras };
        }

        const hiddenMarkerCount = () => supplyLanes().lanes.reduce((a, l) => a + l.hidden, 0);

        const PIP_NAMES = { hidden: 'verdeckt', done: 'erledigt', open: 'liegt offen', failed: 'gescheitert' };
        function pip(kind, color, label) {
            const c = color;
            const fill = kind === 'done' ? c : kind === 'hidden' ? `color-mix(in srgb, ${c} 18%, transparent)` : 'none';
            const stroke = kind === 'failed' ? 'var(--bad)' : kind === 'open' ? 'var(--accent)' : c;
            const dash = kind === 'open' ? ' stroke-dasharray="2.5 2"' : '';
            const mark = kind === 'done' ? '<path d="M6 11.5l3 3 5-6" style="stroke:var(--ink)"/>'
                : kind === 'failed' ? '<path d="M7 8l6 6M13 8l-6 6" style="stroke:var(--bad)"/>' : '';
            const title = label ? ` role="img" aria-label="${esc(label)} ${PIP_NAMES[kind]}"` : ' aria-hidden="true"';
            return `<svg class="pip" viewBox="0 0 20 22"${title}><polygon points="10,1.5 18.5,6.25 18.5,15.75 10,20.5 1.5,15.75 1.5,6.25" style="fill:${fill};stroke:${stroke}"${dash}/>${mark}</svg>`;
        }

        function renderSupply() {
            const { lanes, extras } = supplyLanes();
            const hiddenTotal = lanes.reduce((a, l) => a + l.hidden, 0);
            const normal = lanes.filter((l) => !l.typ.seven);
            const sevens = lanes.filter((l) => l.typ.seven);
            const cols = [...new Set(normal.flatMap((l) => l.typ.supply))].sort((a, b) => a - b);
            const kindOf = (c) => c || 'hidden';

            let rows = normal.map(({ typ, slots, hidden }) => `
                <div class="sg-row${hidden === 0 ? ' empty' : ''}">
                    <span class="sg-label">${glyph(typ)}<span>${esc(typ.label)}</span></span>
                    ${cols.map((v) => `<span class="sg-cell">${(slots[v] || []).map((c) => pip(kindOf(c), cssColor(typ.cssVar), `${typ.label} ${v}er`)).join('')}</span>`).join('')}
                    <span class="sg-left num" style="color:${cssColor(typ.cssVar)}">${hidden || '–'}</span>
                </div>`).join('');
            // Die 7er-Plättchen (je 1 Marker) teilen sich eine Zeile
            if (sevens.length > 0) {
                const hidden = sevens.reduce((a, l) => a + l.hidden, 0);
                rows += `
                <div class="sg-row${hidden === 0 ? ' empty' : ''}">
                    <span class="sg-label"><span class="split-hex" style="--g:${sevens[0].typ.bg}">7</span><span>7er</span></span>
                    <span class="sg-seven">${sevens.map(({ typ, slots }) => slots[7].map((c) => pip(kindOf(c), cssColor(typ.cssVar), `7er ${typ.label}`)).join('')).join('')}</span>
                    <span class="sg-left num">${hidden || '–'}</span>
                </div>`;
            }

            const legendColor = 'var(--muted)';
            let html = `
                <div class="stat-grid">
                    <div class="card stat"><span class="num" style="color:var(--ok)">${state.completedTasks.length}</span><small>erledigt</small></div>
                    <div class="card stat"><span class="num" style="color:var(--accent)">${state.openTasks.length}</span><small>offen</small></div>
                    <div class="card stat"><span class="num" style="color:var(--bad)">${state.failedTasks.length}</span><small>gescheitert</small></div>
                    <div class="card stat"><span class="num">${hiddenTotal}</span><small>verdeckt</small></div>
                </div>
                <section class="card supply" aria-label="Markervorrat">
                    <div class="sg-row head" style="--cols:${cols.length}"><span></span>${cols.map((v) => `<span>${v}</span>`).join('')}<span style="text-align:right">übrig</span></div>
                    <div style="--cols:${cols.length}">${rows}</div>
                    <div class="legend">
                        <span>${pip('hidden', legendColor)}verdeckt</span>
                        <span>${pip('open', legendColor)}liegt offen</span>
                        <span>${pip('done', legendColor)}erledigt</span>
                        <span>${pip('failed', legendColor)}gescheitert</span>
                    </div>`;

            // Aufträge mit Werten außerhalb des Vorrats (z. B. frei eingegeben)
            if (extras.length > 0) {
                html += '<div class="extras">Außerhalb Vorrat:';
                extras.forEach(({ kind, task: t }) => {
                    const typ = TYPE_BY_KEY[t.type];
                    html += `<span class="extra-chip${kind === 'failed' ? ' failed' : ''}" style="--c:${cssColor(typ.cssVar)}">${glyph(typ)} ${t.value}</span>`;
                });
                html += '</div>';
            }
            html += '</section>';

            // Verlauf: zuletzt erledigt/gescheitert, mit Zurückholen
            const recent = [
                ...state.completedTasks.map((t) => ({ ...t, kind: 'done' })),
                ...state.failedTasks.map((t) => ({ ...t, kind: 'failed' })),
            ].sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 5);
            if (recent.length > 0) {
                const full = state.openTasks.length >= taskLimit();
                html += '<section class="history" aria-label="Verlauf"><span class="label-caps">Zuletzt</span>';
                recent.forEach((t) => {
                    const typ = TYPE_BY_KEY[t.type];
                    const done = t.kind === 'done';
                    html += `
                        <div class="h-row">
                            <span class="dot" style="--c:${done ? cssColor(typ.cssVar) : 'var(--bad)'}"></span>
                            <span class="what"><b>${typ.seven ? '7er ' : ''}${esc(typ.label)} ${t.value}</b> <span>${done ? `erledigt · +${t.value}` : 'gescheitert'}</span></span>
                            <button class="ghost-btn" data-action="${done ? 'uncomplete' : 'unfail'}" data-id="${t.id}"${full ? ' disabled title="Alle Auftrags-Slots belegt"' : ''}>${ui('undo')}Zurückholen</button>
                        </div>`;
                });
                html += '</section>';
            }
            $('#pane-vorrat').innerHTML = html;
        }

        function fieldSummary(f) {
            const v = state.fields[f.key];
            const t = fieldTotal(f, v);
            return t ? `${f.short || f.label} ${t}` : '';
        }

        function renderSections() {
            let html = '';
            SECTIONS.forEach((section, si) => {
                const fields = activeFields(section);
                if (fields.length === 0) return; // noch nichts freigespielt
                const open = !uiState.collapsed.includes(section.title);
                const summary = fields.map(fieldSummary).filter(Boolean).join(' · ');
                const allFinal = fields.every((f) => isFinal(f.key)) && summary;
                html += `
                    <div class="sec${open ? ' open' : ''}">
                        <button class="sec-btn" data-action="toggle-section" data-index="${si}" aria-expanded="${open}">
                            ${hexChip(section.chip)}
                            <span class="sec-text"><b>${esc(section.title)}${allFinal ? `<span class="done-badge">${ui('check')}fertig</span>` : ''}</b><small>${esc(open ? section.hint : (summary || section.hint))}</small></span>
                            <span class="num sec-total">${sumSection(section)}</span>
                            <span class="chev">${ui(open ? 'down' : 'right')}</span>
                        </button>`;
                if (open) html += `<div class="rows">${fields.map(fieldRowHtml).join('')}</div>`;
                html += '</div>';
            });
            $('#sectionsRoot').innerHTML = html;
            flashKeys = null;
        }

        function fieldRowHtml(f) {
            const v = state.fields[f.key];
            const flash = flashKeys && flashKeys.includes(f.key) ? ' flash' : '';
            const final = isFinal(f.key);
            const badge = final ? `<span class="done-badge">${ui('check')}fertig</span>` : '';
            const subHtml = f.sub ? `<small>${esc(f.sub)}</small>` : '';
            if (f.kind === 'tally') {
                const pills = v.length > 4
                    ? `<span>${v.length}×</span>`
                    : v.map((x) => `<span>${x}</span>`).join('');
                const sub = f.areas ? `<small>${v.length === 1 ? '1 Gebiet' : `${v.length} Gebiete`}</small>` : subHtml;
                return `
                    <button class="frow${flash}" data-action="open-sheet" data-field="${f.key}">
                        ${glyph(f)}
                        <span class="frow-text"><b>${esc(f.label)}${badge}</b>${sub}</span>
                        <span class="pills">${pills}</span>
                        <span class="frow-total">${fieldTotal(f, v)}</span>
                        <span class="chev">${ui('right')}</span>
                    </button>`;
            }
            if (f.derived) {
                const on = num(v) > 0;
                return `
                    <div class="frow${flash}">
                        ${glyph(f)}
                        <span class="frow-text"><b>${esc(f.label)}</b><small>${flagAreaCount()} Fahnengebiete · steht selbst in einem?</small></span>
                        <button class="switch" role="switch" aria-checked="${on}" aria-label="${esc(f.label)} steht in einem Fahnengebiet" data-action="toggle-derived" data-field="${f.key}"></button>
                        <span class="frow-total">${fieldTotal(f, v)}</span>
                    </div>`;
            }
            const dis = final ? ' disabled' : '';
            return `
                <div class="frow${flash}">
                    ${glyph(f)}
                    <span class="frow-text"><b>${esc(f.label)}${badge}</b>${subHtml}</span>
                    <button class="step" data-action="step" data-field="${f.key}" data-delta="-1" aria-label="${esc(f.label)} minus 1"${dis || (num(v) <= 0 ? ' disabled' : '')}>${ui('minus')}</button>
                    <span class="step-val" aria-live="polite">${num(v)}</span>
                    <button class="step plus" data-action="step" data-field="${f.key}" data-delta="1" aria-label="${esc(f.label)} plus 1"${dis || (f.max != null && num(v) >= f.max ? ' disabled' : '')}>${ui('plus')}</button>
                    <span class="frow-total">${fieldTotal(f, v)}</span>
                </div>`;
        }

        function renderCustom() {
            $('#customRows').innerHTML = state.custom.map((c) => `
                <div class="custom-row" data-custom-id="${c.id}">
                    <input class="custom-label" type="text" placeholder="Feld benennen …" value="${esc(c.label)}" data-role="label" aria-label="Bezeichnung">
                    <input class="pts" type="number" inputmode="numeric" placeholder="0" value="${esc(c.points)}" data-role="points" aria-label="Punkte">
                    <button class="trash" data-action="del-custom" data-id="${c.id}" aria-label="Feld entfernen">${ui('trash')}</button>
                </div>`).join('');
            $('#customSubtotal').textContent = sumCustom();
        }

        function renderUnlocks() {
            let html = '';
            UNLOCKS.forEach((b) => {
                html += `<div class="unlock-box"><h3>${esc(b.box)}</h3>`;
                b.items.forEach((i) => {
                    html += `<label class="unlock-row">
                        <input type="checkbox" data-unlock="${i.key}"${unlocks.includes(i.key) ? ' checked' : ''}>
                        <span><span class="u-name">${esc(i.name)}</span><span class="u-cond">${esc(i.cond)}</span></span>
                    </label>`;
                });
                html += '</div>';
            });
            $('#unlockList').innerHTML = html;
            $('#unlockTitle').textContent = `Freigespielt (${unlocks.length}/${ALL_UNLOCK_KEYS.length})`;
        }

        function renderStrip() {
            $('#stripRow').innerHTML = visibleRecent().map((key) => {
                const f = FIELD_BY_KEY[key];
                const active = sheetKey === key;
                return `<button class="strip-chip${isFinal(key) ? ' final' : ''}" data-action="open-sheet" data-field="${key}" aria-pressed="${active}">
                    ${glyph(f)}<span>${esc(f.short || f.label)}</span><span class="n">${fieldTotal(f, state.fields[f.key])}</span>
                </button>`;
            }).join('');
        }

        // ── Schnelleingabe (Bottom-Sheet) ────────────────────────
        function renderSheet() {
            const el = $('#sheet');
            const f = FIELD_BY_KEY[sheetKey];
            if (!f || !fieldOn(f)) {
                sheetKey = null;
                el.hidden = true;
                $('#sheetScrim').hidden = true;
                return;
            }
            const v = state.fields[f.key];
            const final = isFinal(f.key);
            const dis = final ? ' disabled' : '';
            const sub = f.areas ? `${v.length === 1 ? '1 Gebiet' : `${v.length} Gebiete`} · 1 Punkt je Plättchen` : (f.sub || '');

            let body = '';
            if (f.derived) {
                body = derivedRowHtml(f);
            } else if (f.kind === 'count') {
                body = `
                    <div class="big-stepper">
                        <button class="dial-btn" data-action="step" data-field="${f.key}" data-delta="-1" aria-label="minus 1"${dis || (num(v) <= 0 ? ' disabled' : '')}>−1</button>
                        <span class="num" aria-live="polite">${num(v)}</span>
                        <button class="dial-btn plus" data-action="step" data-field="${f.key}" data-delta="1" aria-label="plus 1"${dis || (f.max != null && num(v) >= f.max ? ' disabled' : '')}>+1</button>
                    </div>
                    ${(f.mult || 1) > 1 ? `<p class="hint" style="text-align:center">× ${f.mult} = <b>${fieldTotal(f, v)}</b> Punkte${f.max != null ? ` · max. ${f.max}` : ''}</p>` : ''}`;
            } else if (f.areas) {
                body = areasBodyHtml(f, v, dis);
            } else if (f.supply) {
                body = supplyBodyHtml(f, v, dis);
            } else {
                body = chipsBodyHtml(f, v, dis);
            }

            const finalRow = f.derived ? '' : `
                <div class="switch-row">
                    <span class="sec-text"><b>Fertig gezählt</b><small>sperrt das Feld gegen versehentliche Eingaben</small></span>
                    <button class="switch" role="switch" aria-checked="${final}" aria-label="${esc(f.label)} fertig gezählt" data-action="toggle-final" data-field="${f.key}"></button>
                </div>`;

            el.innerHTML = `
                <div class="grab"></div>
                <div class="sheet-head">
                    ${hexChip(f)}
                    <span class="sec-text"><b id="sheetTitle">${esc(f.label)}</b><small>${esc(sub)}</small></span>
                    <span class="num sheet-total">${fieldTotal(f, v)}</span>
                    <button class="icon-btn" data-action="sheet-close" aria-label="Schließen">${ui('x')}</button>
                </div>
                ${body}
                ${finalRow}`;
            el.hidden = false;
            $('#sheetScrim').hidden = false;
        }

        function derivedRowHtml(f) {
            const on = num(state.fields[f.key]) > 0;
            return `
                <div class="note">${ui('telescope')}<span>Fahnengebiete gesamt <b>${flagAreaCount()}</b> × ${f.mult} = <b>${flagAreaCount() * f.mult}</b></span></div>
                <div class="switch-row">
                    <span class="sec-text"><b>Steht selbst in einem Fahnengebiet</b><small>nur dann zählt die Sternwarte</small></span>
                    <button class="switch" role="switch" aria-checked="${on}" aria-label="Sternwarte steht in einem Fahnengebiet" data-action="toggle-derived" data-field="${f.key}"></button>
                </div>`;
        }

        function areasBodyHtml(f, v, dis) {
            if (sheetSel >= v.length) sheetSel = v.length - 1;
            const sel = sheetSel;
            const tiles = v.length === 0
                ? '<span class="hint">Noch kein Gebiet – unten eine Größe antippen</span>'
                : v.map((x, i) => `<button class="tile" role="radio" aria-checked="${i === sel}" aria-label="Gebiet ${i + 1} mit ${x} Plättchen" data-action="area-select" data-index="${i}">${x}</button>`).join('');
            let html = `
                <div>
                    <span class="label-caps" style="display:block;margin-bottom:8px">Abgeschlossene Gebiete</span>
                    <div class="tiles" role="radiogroup" aria-label="Gebiet zum Anpassen wählen">${tiles}</div>
                </div>`;
            if (sel >= 0) {
                html += `
                <div class="dial">
                    <button class="dial-btn" data-action="area-adjust" data-delta="-1" aria-label="Gewähltes Gebiet 1 Plättchen kleiner"${dis || (v[sel] <= 1 ? ' disabled' : '')}>−1</button>
                    <span class="dial-val" aria-live="polite"><span class="num">${v[sel]}</span><small>Gebiet ${sel + 1} · Plättchen</small></span>
                    <button class="dial-btn plus" data-action="area-adjust" data-delta="1" aria-label="Gewähltes Gebiet 1 Plättchen größer"${dis}>+1</button>
                    <button class="trash" data-action="area-remove" aria-label="Gewähltes Gebiet entfernen"${dis}>${ui('trash')}</button>
                </div>`;
            }
            html += `
                <div>
                    <div class="row-between"><span class="label-caps">Neues Gebiet</span><small>deine häufigsten Größen</small></div>
                    <div class="chip-grid">${popularSizes(f.key).map((s) => `<button class="chip" data-action="area-add" data-value="${s}" aria-label="Neues Gebiet mit ${s} Plättchen"${dis}>${s}</button>`).join('')}</div>
                </div>`;
            const stern = FIELD_BY_KEY.sternwarte;
            if (fieldOn(stern)) {
                const areas = flagAreaCount();
                const counts = num(state.fields.sternwarte) > 0;
                html += `<div class="note">${ui('telescope')}<span>Fahnengebiete gesamt <b>${areas}</b> → Sternwarte <b>+${areas * stern.mult}</b>${counts ? '' : ', wenn sie selbst in einem steht'}</span></div>`;
            }
            return html;
        }

        function entryTilesHtml(entries, indices, dis) {
            if (indices.length === 0) return '';
            return `<div class="tiles">${indices.map((i) => `<button class="tile" data-action="remove-entry" data-index="${i}" aria-label="${entries[i]} entfernen"${dis}>${entries[i]}${ui('x')}</button>`).join('')}</div>`;
        }

        function supplyBodyHtml(f, v, dis) {
            const { usedPerValue, overflow } = allocateSupply(f.supply, v);
            const seen = {};
            const chips = f.supply.map((c) => {
                seen[c] = (seen[c] || 0) + 1;
                const used = seen[c] <= (usedPerValue[c] || 0);
                const label = used ? `Auftrag ${c} erledigt – tippen zum Zurücksetzen` : `Auftrag ${c} als erledigt markieren`;
                return `<button class="chip${used ? ' used' : ''}" data-action="${used ? 'remove-value' : 'add-entry'}" data-value="${c}" aria-pressed="${used}" aria-label="${label}"${dis}>${c}</button>`;
            }).join('');
            let html = `
                <div>
                    <div class="row-between"><span class="label-caps">Marker im Vorrat</span><small>antippen = erledigt</small></div>
                    <div class="chip-grid" style="--n:${Math.min(f.supply.length, 6)}">${chips}</div>
                </div>`;
            html += entryTilesHtml(v, overflow, dis);
            if (f.chips.length > 1) html += otherValueHtml(dis);
            return html;
        }

        function chipsBodyHtml(f, v, dis) {
            const all = v.map((_, i) => i);
            return `
                <div>
                    <span class="label-caps" style="display:block;margin-bottom:8px">Eingetragen</span>
                    ${entryTilesHtml(v, all, dis) || '<p class="hint">Noch nichts eingetragen</p>'}
                </div>
                <div class="chip-grid" style="--n:${(f.chips || []).length}">${(f.chips || []).map((c) => `<button class="chip" data-action="add-entry" data-value="${c}"${dis}>+${c}</button>`).join('')}</div>
                ${otherValueHtml(dis)}`;
        }

        function otherValueHtml(dis) {
            return `
                <div class="other-row">
                    <label for="entryOther">Anderer Wert</label>
                    <input id="entryOther" class="num-input" type="number" inputmode="numeric" placeholder="…" data-role="entry-value"${dis}>
                    <button class="sq-btn" data-action="entry-custom-add" aria-label="Wert hinzufügen"${dis}>${ui('plus')}</button>
                </div>`;
        }

        function pulseTotals() {
            if (navigator.vibrate) { try { navigator.vibrate(10); } catch { /* egal */ } }
            const el = $('#totalNum');
            el.classList.remove('flash-total');
            void el.offsetWidth;
            el.classList.add('flash-total');
        }

        // Fokus über das Neuzeichnen retten (gleiche Aktion im selben Bereich)
        const FOCUS_HOSTS = '#sheet, #pane-auftraege, #pane-vorrat, #sectionsRoot, #stripRow, #tablist';
        function focusTarget() {
            const a = document.activeElement;
            if (!a || !a.dataset || !a.dataset.action) return null;
            const host = a.closest(FOCUS_HOSTS);
            if (!host) return null;
            const d = a.dataset;
            let sel = `[data-action="${d.action}"]`;
            ['field', 'value', 'index', 'type', 'tab', 'delta'].forEach((k) => {
                if (d[k] != null) sel += `[data-${k}="${d[k]}"]`;
            });
            return { host: `#${host.id}`, sel };
        }

        function renderAll() {
            const focus = focusTarget();
            renderHeader();
            renderHero();
            renderTabs();
            renderTracker();
            renderSupply();
            renderSections();
            renderCustom();
            renderStrip();
            renderSheet();
            if (focus) {
                const el = $(`${focus.host} ${focus.sel}`);
                if (el && !el.disabled) el.focus({ preventScroll: true });
            }
        }

        // ── Aktionen ─────────────────────────────────────────────
        function commit(pulse) {
            saveState();
            renderAll();
            if (pulse) pulseTotals();
        }

        function setTab(tab) {
            if (!TABS.includes(tab)) return;
            uiState.tab = tab;
            saveUi();
            renderTabs();
            window.scrollTo({ top: Math.min(window.scrollY, $('#panes').offsetTop - 60) });
        }

        function changeField(key, fn) {
            if (isFinal(key)) return;
            state.fields[key] = fn(state.fields[key]);
            flashKeys = [key];
            promoteRecent(key);
            commit(true);
        }

        function completeTask(t) {
            state.fields[t.type] = [...state.fields[t.type], t.value];
            state.openTasks = state.openTasks.filter((x) => x.id !== t.id);
            state.completedTasks.push({ id: t.id, type: t.type, value: t.value, at: Date.now() });
            flashKeys = [t.type];
            promoteRecent(t.type);
            commit(true);
        }

        function uncompleteTask(id) {
            const t = state.completedTasks.find((x) => x.id === id);
            if (!t || state.openTasks.length >= taskLimit()) return;
            const arr = state.fields[t.type];
            const i = arr.lastIndexOf(t.value);
            if (i >= 0) state.fields[t.type] = [...arr.slice(0, i), ...arr.slice(i + 1)];
            state.completedTasks = state.completedTasks.filter((x) => x.id !== id);
            state.openTasks.push({ id: t.id, type: t.type, value: t.value });
            commit(true);
        }

        function failTask(t) {
            state.openTasks = state.openTasks.filter((x) => x.id !== t.id);
            state.failedTasks.push({ id: t.id, type: t.type, value: t.value, at: Date.now() });
            commit();
        }

        function unfailTask(id) {
            const t = state.failedTasks.find((x) => x.id === id);
            if (!t || state.openTasks.length >= taskLimit()) return;
            state.failedTasks = state.failedTasks.filter((x) => x.id !== id);
            state.openTasks.push({ id: t.id, type: t.type, value: t.value });
            commit();
        }

        function addOpenTask(value) {
            if (!pickType || value <= 0 || state.openTasks.length >= taskLimit()) return;
            state.openTasks.push({ id: uid(), type: pickType, value });
            pickType = null;
            composerOpen = false;
            commit();
        }

        function openSheet(key) {
            sheetKey = sheetKey === key ? null : key;
            sheetSel = sheetKey ? state.fields[sheetKey].length - 1 : -1;
            renderStrip();
            renderSheet();
            if (sheetKey) $('#sheet .icon-btn').focus({ preventScroll: true });
        }

        function closeSheet() {
            const key = sheetKey;
            sheetKey = null;
            renderStrip();
            renderSheet();
            const back = key && ($(`#sectionsRoot [data-field="${key}"]`) || $(`#stripRow [data-field="${key}"]`));
            if (back) back.focus({ preventScroll: true });
        }

        function toggleMenu(force) {
            const pop = $('#menuPop');
            pop.hidden = force != null ? !force : !pop.hidden;
            $('#menuBtn').setAttribute('aria-expanded', String(!pop.hidden));
        }

        const overlay = $('#unlockOverlay');
        function openUnlocks() {
            toggleMenu(false);
            sheetKey = null;
            renderSheet();
            renderUnlocks();
            overlay.hidden = false;
            $('#unlockOverlay .icon-btn').focus();
        }

        function setUnlocks(next) {
            unlocks = next;
            saveJson(UNLOCK_KEY, unlocks);
            if (pickType && !typeOn(TYPE_BY_KEY[pickType])) pickType = null;
            renderUnlocks();
            renderAll();
        }

        function handleAction(action, btn) {
            const d = btn.dataset;
            const key = d.field || sheetKey;
            const task = d.id && state.openTasks.find((t) => t.id === d.id);
            switch (action) {
                case 'tab': setTab(d.tab); break;
                case 'menu-toggle': toggleMenu(); break;
                case 'menu-unlocks': openUnlocks(); break;
                case 'menu-share': shareExport(); break;
                case 'menu-copy': copyText(buildExport()); break;
                case 'menu-theme':
                    uiState.theme = uiState.theme === 'papier' ? 'nacht' : 'papier';
                    saveUi();
                    renderHeader();
                    break;
                case 'unlock-close': overlay.hidden = true; break;
                case 'unlock-all': setUnlocks([...ALL_UNLOCK_KEYS]); break;
                case 'unlock-none':
                    if (confirm('Alle Freischaltungen entfernen?')) setUnlocks([]);
                    break;

                case 'toggle-fuji':
                    state.fuji = !state.fuji;
                    commit();
                    break;
                case 'open-composer':
                    composerOpen = !composerOpen;
                    renderTracker();
                    if (composerOpen) $('#composer').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    break;
                case 'pick-type':
                    pickType = pickType === d.type ? null : d.type;
                    renderTracker();
                    break;
                case 'add-task': addOpenTask(num(d.value)); break;
                case 'task-custom-add': addOpenTask(num($('#taskOther') && $('#taskOther').value)); break;
                case 'complete': if (task) completeTask(task); break;
                case 'fail': if (task) failTask(task); break;
                case 'remove-task':
                    state.openTasks = state.openTasks.filter((t) => t.id !== d.id);
                    commit();
                    break;
                case 'uncomplete': uncompleteTask(d.id); break;
                case 'unfail': unfailTask(d.id); break;

                case 'toggle-section': {
                    const title = SECTIONS[num(d.index)].title;
                    uiState.collapsed = uiState.collapsed.includes(title)
                        ? uiState.collapsed.filter((t) => t !== title)
                        : [...uiState.collapsed, title];
                    saveUi();
                    renderSections();
                    break;
                }
                case 'open-sheet': openSheet(d.field); break;
                case 'sheet-close': closeSheet(); break;
                case 'step': {
                    const f = FIELD_BY_KEY[key];
                    const max = f.max != null ? f.max : Infinity;
                    changeField(key, (v) => Math.min(max, Math.max(0, num(v) + num(d.delta))));
                    break;
                }
                case 'toggle-derived':
                    state.fields[key] = num(state.fields[key]) > 0 ? 0 : 1;
                    promoteRecent(key);
                    commit(true);
                    break;
                case 'toggle-final':
                    state.finalFields = isFinal(key) ? state.finalFields.filter((k) => k !== key) : [...state.finalFields, key];
                    commit();
                    break;

                case 'area-select':
                    sheetSel = num(d.index);
                    renderSheet();
                    break;
                case 'area-add': {
                    const size = num(d.value);
                    if (isFinal(key)) break;
                    countSize(key, size, 1);
                    sheetSel = state.fields[key].length;
                    changeField(key, (v) => [...v, size]);
                    break;
                }
                case 'area-adjust': {
                    const v = state.fields[key];
                    const old = v[sheetSel];
                    const next = Math.max(1, old + num(d.delta));
                    if (old == null || next === old || isFinal(key)) break;
                    countSize(key, old, -1);
                    countSize(key, next, 1);
                    changeField(key, (arr) => arr.map((x, i) => (i === sheetSel ? next : x)));
                    break;
                }
                case 'area-remove': {
                    const v = state.fields[key];
                    if (v[sheetSel] == null || isFinal(key)) break;
                    countSize(key, v[sheetSel], -1);
                    const idx = sheetSel;
                    sheetSel = v.length - 2;
                    changeField(key, (arr) => arr.filter((_, i) => i !== idx));
                    break;
                }
                case 'add-entry': changeField(key, (v) => [...v, num(d.value)]); break;
                case 'remove-entry': changeField(key, (v) => v.filter((_, i) => i !== num(d.index))); break;
                case 'remove-value':
                    changeField(key, (v) => {
                        const i = v.lastIndexOf(num(d.value));
                        return i >= 0 ? [...v.slice(0, i), ...v.slice(i + 1)] : v;
                    });
                    break;
                case 'entry-custom-add': {
                    const n = num($('#entryOther') && $('#entryOther').value);
                    if (n > 0) changeField(key, (v) => [...v, n]);
                    break;
                }

                case 'add-custom':
                    state.custom.push({ id: uid(), label: '', points: '' });
                    commit();
                    break;
                case 'del-custom':
                    state.custom = state.custom.filter((c) => c.id !== d.id);
                    commit();
                    break;
                case 'reset':
                    if (!confirm('Blatt wirklich zurücksetzen? Alle Einträge gehen verloren (Freigespieltes bleibt).')) break;
                    state = initialState();
                    pickType = null;
                    composerOpen = false;
                    sheetKey = null;
                    $('#metaPartie').value = '';
                    $('#metaSpieler').value = '';
                    commit();
                    break;
            }
        }

        // ── Event-Handling ───────────────────────────────────────
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!e.target.closest('.menu-wrap')) toggleMenu(false);
            if (e.target === overlay) overlay.hidden = true;
            if (!btn || btn.disabled) return;
            handleAction(btn.dataset.action, btn);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (!overlay.hidden) overlay.hidden = true;
                else if (!$('#menuPop').hidden) toggleMenu(false);
                else if (sheetKey) closeSheet();
                return;
            }
            if (e.key === 'Enter' && e.target.matches('[data-role="task-value"]')) {
                addOpenTask(num(e.target.value));
            } else if (e.key === 'Enter' && e.target.matches('[data-role="entry-value"]')) {
                const n = num(e.target.value);
                if (n > 0 && sheetKey) {
                    changeField(sheetKey, (v) => [...v, n]);
                    const input = $('#entryOther');
                    if (input) input.focus();
                }
            }
        });

        // Pfeiltasten in der Tab-Leiste (WAI-ARIA Tabs)
        $('#tablist').addEventListener('keydown', (e) => {
            if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
            const i = TABS.indexOf(uiState.tab) + (e.key === 'ArrowRight' ? 1 : -1);
            if (i < 0 || i >= TABS.length) return;
            setTab(TABS[i]);
            $(`#tab-${TABS[i]}`).focus();
        });

        // Wischen links/rechts wechselt den Tab
        let swipe = null;
        $('#panes').addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            swipe = e.touches.length === 1 && !e.target.closest('input') ? { x: t.clientX, y: t.clientY } : null;
        }, { passive: true });
        $('#panes').addEventListener('touchend', (e) => {
            if (!swipe) return;
            const t = e.changedTouches[0];
            const dx = t.clientX - swipe.x;
            const dy = t.clientY - swipe.y;
            swipe = null;
            if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
            const i = TABS.indexOf(uiState.tab) + (dx < 0 ? 1 : -1);
            if (i >= 0 && i < TABS.length) setTab(TABS[i]);
        }, { passive: true });

        $('#customRows').addEventListener('input', (e) => {
            const row = e.target.closest('[data-custom-id]');
            const c = row && state.custom.find((x) => x.id === row.dataset.customId);
            if (!c) return;
            if (e.target.dataset.role === 'label') c.label = e.target.value;
            if (e.target.dataset.role === 'points') c.points = e.target.value;
            saveState();
            $('#customSubtotal').textContent = sumCustom();
            renderHero();
        });

        $('#metaPartie').addEventListener('input', (e) => {
            state.meta.partie = e.target.value;
            saveState();
            renderHeader();
        });
        $('#metaSpieler').addEventListener('input', (e) => {
            state.meta.spieler = e.target.value;
            saveState();
        });

        $('#unlockList').addEventListener('change', (e) => {
            const key = e.target.dataset.unlock;
            if (!key) return;
            setUnlocks(e.target.checked ? [...unlocks, key] : unlocks.filter((k) => k !== key));
        });

        // Teilen / Kopieren
        let copiedTimer = null;
        function showCopied() {
            const share = $('#menuShare span');
            const copy = $('#menuCopy span');
            share.textContent = 'Kopiert';
            copy.textContent = 'Kopiert';
            clearTimeout(copiedTimer);
            copiedTimer = setTimeout(() => {
                share.textContent = 'Teilen';
                copy.textContent = 'Kopieren';
            }, 1500);
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            showCopied();
        }

        async function shareExport() {
            const text = buildExport();
            if (navigator.share) {
                try {
                    await navigator.share({ text });
                    return;
                } catch (e) {
                    if (e && e.name === 'AbortError') return;
                }
            }
            copyText(text);
        }

        // ── Init ─────────────────────────────────────────────────
        $('#metaPartie').value = state.meta.partie;
        $('#metaSpieler').value = state.meta.spieler;
        renderAll();
    </script>
</body>
</html>
