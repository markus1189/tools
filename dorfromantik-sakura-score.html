<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Digitale Wertungskarte für Dorfromantik: Sakura mit Auftrags-Tracker und Kampagnen-Freischaltungen">
    <meta name="theme-color" content="#140E11">
    <title>Dorfromantik Sakura Wertung</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
            --bg: #140E11;
            --card: #1E161A;
            --raised: #2A1F25;
            --line: #3B2D34;
            --text: #F3EBEE;
            --muted: #AE9DA5;
            --faint: #6E5E65;
            --accent: #EE8FAB;
            --on-accent: #1A0F14;
            --ink: #1A0F14;
            --ok: #8FD18A;
            --bad: #F2806F;
            --cherry: #EC99C2;
            --road: #B08A70;
            --village: #D3746E;
            --river: #7AC8CF;
            --rice: #8FC369;
            --ring: #B3A4C8;
            --glyph-outline: #fff;
            --scrim: rgba(8, 4, 6, 0.6);
            --shadow: rgba(0, 0, 0, 0.55);
            --display: 'Shippori Mincho B1', Georgia, serif;
            --sans: 'Zen Maru Gothic', system-ui, sans-serif;
            --hex: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        /* Papier: angelehnt an das gedruckte Wertungsblatt */
        :root[data-theme="papier"] {
            color-scheme: light;
            --bg: #F4ECE1;
            --card: #FFFBF4;
            --raised: #EADFD0;
            --line: #D9C9B5;
            --text: #2B1F23;
            --muted: #6B5A60;
            --faint: #A8968C;
            --accent: #B9466A;
            --on-accent: #FFFFFF;
            --ok: #2F7A34;
            --bad: #B23A2B;
            --cherry: #D0679A;
            --road: #86624C;
            --village: #B4504A;
            --river: #2F8F99;
            --rice: #5B9636;
            --ring: #7E6D9C;
            --glyph-outline: #FFFBF4;
            --scrim: rgba(43, 31, 35, 0.35);
            --shadow: rgba(60, 40, 30, 0.18);
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 0 calc(84px + env(safe-area-inset-bottom));
        }

        button, input {
            font-family: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
            touch-action: manipulation;
        }

        button:disabled {
            cursor: default;
            opacity: 0.4;
        }

        [hidden] {
            display: none !important;
        }

        button:focus-visible, input:focus-visible, a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .num {
            font-family: var(--display);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .ico {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: none;
        }

        .app {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        /* Kopf */
        .top {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 8px 8px 0;
        }

        .back-link {
            justify-self: start;
            display: flex;
            align-items: center;
            gap: 2px;
            min-height: 44px;
            padding: 0 8px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover { color: var(--accent); }

        .top-title { text-align: center; }
        .top-title h1 { font-size: 15px; font-weight: 700; }
        .kicker {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.06em;
        }

        .menu-wrap {
            justify-self: end;
            position: relative;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover { color: var(--text); }

        .menu-pop {
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            min-width: 200px;
            box-shadow: 0 10px 30px var(--shadow);
            z-index: 30;
        }

        .menu-pop button {
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
            background: transparent;
            text-align: left;
            min-height: 44px;
            padding: 0 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
        }

        .menu-pop button:hover {
            background: var(--raised);
            color: var(--accent);
        }

        /* Gesamtstand */
        .hero {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            padding: 6px 20px 14px;
        }

        .hero-total .num {
            display: block;
            font-size: 64px;
            letter-spacing: -0.02em;
        }

        .label-caps {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .hero-total .label-caps { display: block; margin-top: 4px; letter-spacing: 0.14em; }

        .cross {
            width: 170px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 4px;
        }

        .cross-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 13px;
        }

        .cross-head b { font-size: 17px; }
        .cross-head .next { color: var(--muted); font-size: 12px; }

        .bar {
            height: 8px;
            border-radius: 4px;
            background: var(--raised);
            overflow: hidden;
        }

        .bar > span {
            display: block;
            height: 100%;
            border-radius: 4px;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .cross-need { font-size: 12px; color: var(--muted); }

        .flash-total { animation: pulse-total 0.7s ease; }

        @keyframes pulse-total {
            0% { transform: scale(1.08); color: var(--accent); }
            100% { transform: scale(1); }
        }

        /* Tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--bg);
            padding: 6px 16px 8px;
        }

        .tablist {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 4px;
            padding: 4px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
        }

        .tab {
            min-height: 44px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font-weight: 700;
            font-size: 14px;
        }

        .tab[aria-selected="true"] {
            background: var(--accent);
            color: var(--on-accent);
        }

        .tab .badge {
            display: inline-block;
            min-width: 18px;
            margin-left: 4px;
            padding: 0 5px;
            border-radius: 9px;
            background: var(--accent);
            color: var(--on-accent);
            font-size: 11px;
            line-height: 18px;
        }

        .tab[aria-selected="true"] .badge {
            background: var(--on-accent);
            color: var(--accent);
        }

        main {
            touch-action: pan-y;
            min-height: 60vh;
        }

        .pane { padding: 4px 16px 16px; }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
        }

        .pane-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 0;
        }

        .pane-head h2 { font-size: 17px; font-weight: 700; }
        .pane-head h2 span { color: var(--muted); font-weight: 500; }

        .hint {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.4;
        }

        /* Aufträge */
        .fuji-btn {
            min-height: 36px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            border: 1.5px dashed var(--line);
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        .fuji-btn[aria-pressed="true"] {
            border-style: solid;
            border-color: var(--accent);
            color: var(--accent);
        }

        .slots {
            display: grid;
            grid-template-columns: repeat(var(--slots), minmax(0, 1fr));
            gap: 8px;
        }

        .task-card {
            border: 1.5px solid var(--c);
            border-radius: 16px;
            background: var(--card);
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .task-hex {
            width: 52px;
            height: 58px;
            clip-path: var(--hex);
            background: var(--bgc, var(--c));
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
        }

        .task-hex .num { font-size: 20px; }
        .task-hex .glyph { width: 16px; height: 16px; }

        .task-name {
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .done-btn {
            width: 100%;
            min-height: 44px;
            border: none;
            border-radius: 10px;
            background: var(--c);
            color: var(--ink);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .done-btn:active, .new-slot:active, .chip:active, .step:active { transform: scale(0.95); }

        .task-actions {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .task-actions button {
            flex: 1;
            min-height: 44px;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .task-actions .fail { border-color: var(--bad); color: var(--bad); }

        .slots.four .done-label { display: none; }

        .new-slot {
            min-height: 186px;
            border: none;
            border-radius: 16px;
            background: var(--accent);
            color: var(--on-accent);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent), 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.15;
            padding: 10px 8px;
        }

        .new-slot svg {
            width: 52px;
            height: 58px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.6;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .new-slot[aria-expanded="true"] {
            background: transparent;
            color: var(--accent);
            box-shadow: inset 0 0 0 1.5px var(--accent);
        }

        .composer {
            margin-top: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .type-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 6px;
        }

        .seven-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
        }

        .type-btn {
            min-height: 48px;
            border: 1.5px solid color-mix(in srgb, var(--c) 45%, transparent);
            border-radius: 12px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 4px;
            font-size: 12px;
            font-weight: 700;
        }

        .type-btn .glyph { width: 24px; height: 24px; }

        .type-btn[aria-pressed="true"] {
            background: var(--c);
            border-color: var(--c);
            color: var(--ink);
        }

        .seven-btn[aria-pressed="true"] {
            background: var(--raised);
            border-color: var(--accent);
            color: var(--text);
        }

        .split-hex {
            width: 20px;
            height: 22px;
            flex: none;
            clip-path: var(--hex);
            background: var(--g);
            color: var(--ink);
            font-family: var(--display);
            font-weight: 800;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .value-grid {
            display: grid;
            grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr));
            gap: 6px;
        }

        .value-btn {
            min-height: 60px;
            border: 1.5px solid var(--c, var(--accent));
            border-radius: 12px;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .value-btn .num { font-size: 24px; }
        .value-btn small { font-size: 11px; color: var(--muted); }

        .other-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .other-row label {
            flex: 1;
            font-size: 13px;
            color: var(--muted);
        }

        .num-input {
            width: 96px;
            min-height: 44px;
            border: 1.5px dashed var(--line);
            border-radius: 10px;
            background: transparent;
            font-size: 15px;
            text-align: center;
        }

        .num-input:focus { outline: none; border-color: var(--accent); }

        .sq-btn {
            width: 44px;
            height: 44px;
            flex: none;
            border: 1.5px solid var(--accent);
            border-radius: 10px;
            background: transparent;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stats-link {
            width: 100%;
            margin-top: 12px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border: none;
            border-top: 1px dashed var(--line);
            background: transparent;
            color: var(--muted);
            font-size: 13px;
            text-align: left;
        }

        .stats-link .go {
            display: flex;
            align-items: center;
            gap: 2px;
            color: var(--text);
            font-weight: 700;
        }

        .ok { color: var(--ok); font-weight: 700; }
        .bad { color: var(--bad); font-weight: 700; }

        /* Vorrat */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
            padding-top: 10px;
        }

        .stat {
            padding: 8px 10px;
        }

        .stat .num { font-size: 22px; display: block; }
        .stat small { font-size: 11px; color: var(--muted); }

        .supply {
            margin-top: 12px;
            padding: 10px 12px 12px;
        }

        .sg-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) repeat(var(--cols), 54px) 40px;
            align-items: center;
            min-height: 40px;
            border-top: 1px solid var(--line);
        }

        .sg-row.head {
            min-height: 26px;
            border-top: none;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-align: center;
        }

        .sg-row.empty > * { opacity: 0.45; }

        .sg-label {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            font-size: 14px;
            font-weight: 700;
            text-align: left;
        }

        .sg-label > span:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sg-label .glyph { width: 20px; height: 20px; stroke-width: 1; }

        .sg-cell {
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .sg-seven {
            grid-column: span var(--cols);
            display: flex;
            justify-content: center;
            gap: 14px;
        }

        .sg-left {
            text-align: right;
            font-size: 18px;
        }

        .pip { width: 20px; height: 22px; flex: none; }
        .pip polygon { stroke-width: 1.8; }
        .pip path { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            margin-top: 6px;
            padding-top: 10px;
            border-top: 1px dashed var(--line);
            font-size: 11px;
            color: var(--muted);
        }

        .legend span { display: flex; align-items: center; gap: 5px; }
        .legend .pip { width: 12px; height: 13px; }

        .extras {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed var(--line);
            font-size: 12px;
            color: var(--muted);
        }

        .extra-chip {
            min-height: 36px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 10px;
            border: 1px solid var(--c);
            border-radius: 10px;
            background: transparent;
            font-weight: 700;
        }

        .extra-chip.failed { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
        .extra-chip .glyph { width: 15px; height: 15px; stroke-width: 1; }

        .history { margin-top: 16px; }
        .history .label-caps { display: block; margin-bottom: 6px; }

        .h-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 52px;
            border-top: 1px solid var(--line);
            font-size: 14px;
        }

        .h-row .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--c);
            flex: none;
        }

        .h-row .what { flex: 1; min-width: 0; }
        .h-row .what span { color: var(--muted); }

        .ghost-btn {
            min-height: 44px;
            padding: 0 12px;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            background: transparent;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .ghost-btn:active { transform: scale(0.95); }

        /* Wertung */
        .meta-row {
            display: flex;
            gap: 8px;
            padding: 6px 0 12px;
        }

        .meta-row input {
            border: none;
            border-bottom: 1.5px dashed var(--line);
            background: transparent;
            font-size: 14px;
            padding: 8px 2px;
            min-width: 0;
            border-radius: 0;
        }

        .meta-row input:focus { outline: none; border-bottom-color: var(--accent); }
        .meta-row .partie { width: 96px; }
        .meta-row .spieler { flex: 1; }

        .score-list { overflow: hidden; }

        .sec + .sec { border-top: 1px solid var(--line); }
        .sec.open { background: color-mix(in srgb, var(--raised) 45%, var(--card)); }

        .sec-btn {
            width: 100%;
            min-height: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border: none;
            background: transparent;
            text-align: left;
        }

        .hex-chip {
            width: 32px;
            height: 36px;
            flex: none;
            clip-path: var(--hex);
            background: color-mix(in srgb, var(--c, var(--accent)) 28%, var(--raised));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hex-chip .glyph { width: 20px; height: 20px; }

        .sec-text { flex: 1; min-width: 0; }
        .sec-text b { display: block; font-size: 15px; }

        .sec-text small {
            display: block;
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sec-total { font-size: 20px; }
        .chev { color: var(--muted); }

        .rows { padding: 0 12px 8px; }

        .frow {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 56px;
            border: none;
            border-top: 1px dashed var(--line);
            background: transparent;
            text-align: left;
            padding: 4px 0;
        }

        .frow .glyph { width: 22px; height: 22px; }
        .frow-text { flex: 1; min-width: 0; }
        .frow-text b { display: block; font-size: 14px; }
        .frow-text small { display: block; font-size: 11px; color: var(--muted); line-height: 1.3; }

        .pills {
            display: flex;
            gap: 4px;
            font-size: 12px;
            color: var(--muted);
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 110px;
        }

        .pills span {
            padding: 2px 7px;
            border-radius: 6px;
            background: var(--raised);
        }

        .frow-total {
            min-width: 30px;
            text-align: right;
            font-weight: 700;
            font-size: 16px;
            font-variant-numeric: tabular-nums;
        }

        .done-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-left: 6px;
            padding: 1px 7px;
            border-radius: 999px;
            border: 1px solid var(--ok);
            color: var(--ok);
            font-size: 11px;
            font-weight: 700;
            vertical-align: 1px;
        }

        .done-badge .ico { width: 11px; height: 11px; stroke-width: 3; }

        .step {
            width: 44px;
            height: 44px;
            flex: none;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step.plus { border-color: var(--accent); color: var(--accent); }

        .step-val {
            width: 24px;
            text-align: center;
            font-weight: 700;
            font-size: 17px;
            font-variant-numeric: tabular-nums;
        }

        .switch {
            width: 48px;
            height: 28px;
            flex: none;
            border: none;
            border-radius: 14px;
            background: var(--line);
            padding: 3px;
            display: flex;
            align-items: center;
        }

        .switch::after {
            content: '';
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #F3EBEE;
            transition: transform 0.15s ease;
        }

        .switch[aria-checked="true"] { background: var(--ok); }
        .switch[aria-checked="true"]::after { transform: translateX(20px); }

        .flash { animation: flash-row 0.9s ease; }

        @keyframes flash-row {
            0% { background: color-mix(in srgb, var(--accent) 25%, transparent); }
            100% { background: transparent; }
        }

        .custom-card { margin-top: 12px; padding: 4px 12px 12px; }

        .custom-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 52px;
            border-top: 1px dashed var(--line);
        }

        .custom-label {
            flex: 1;
            min-width: 0;
            border: none;
            border-bottom: 1.5px dashed var(--line);
            background: transparent;
            font-size: 14px;
            padding: 6px 2px;
            border-radius: 0;
        }

        .pts {
            width: 64px;
            text-align: right;
            font-size: 17px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            border: none;
            border-bottom: 1.5px solid var(--line);
            background: transparent;
            padding: 6px 2px;
            border-radius: 0;
        }

        .custom-label:focus, .pts:focus { outline: none; border-bottom-color: var(--accent); }

        .add-btn {
            margin-top: 10px;
            width: 100%;
            min-height: 44px;
            border: 1.5px dashed var(--line);
            border-radius: 12px;
            background: transparent;
            color: var(--accent);
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .reset {
            display: block;
            margin: 16px auto 0;
            min-height: 44px;
            padding: 0 12px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 13px;
            text-decoration: underline;
        }

        .reset:hover { color: var(--bad); }

        /* Schnellzugriff */
        .dock {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 25;
            background: var(--card);
            border-top: 1px solid var(--line);
            padding: 10px 0 calc(12px + env(safe-area-inset-bottom));
        }

        .strip {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 16px;
            scrollbar-width: none;
        }

        .strip::-webkit-scrollbar { display: none; }

        .strip-chip {
            flex: none;
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            border: 1.5px solid var(--line);
            border-radius: 12px;
            background: var(--raised);
            font-size: 13px;
            font-weight: 700;
        }

        .strip-chip .glyph { width: 17px; height: 17px; }
        .strip-chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
        .strip-chip.final .n { color: var(--ok); }

        .strip-chip[aria-pressed="true"] {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 14%, var(--raised));
            color: var(--accent);
        }

        /* Bottom-Sheet */
        .scrim {
            position: fixed;
            inset: 0;
            z-index: 40;
            background: var(--scrim);
        }

        .sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 41;
            max-width: 480px;
            max-height: 88vh;
            margin: 0 auto;
            overflow-y: auto;
            background: var(--card);
            border-top: 1.5px solid var(--accent);
            border-radius: 24px 24px 0 0;
            padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
            box-shadow: 0 -10px 30px var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .grab {
            width: 40px;
            height: 4px;
            border-radius: 2px;
            background: var(--line);
            align-self: center;
        }

        .sheet-head {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sheet-head .hex-chip { width: 40px; height: 44px; }
        .sheet-head .sec-text b { font-size: 18px; }
        .sheet-total { font-size: 34px; color: var(--accent); }

        .tiles {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 48px;
            align-items: center;
        }

        .tile {
            min-width: 48px;
            min-height: 48px;
            padding: 0 12px;
            border: 1.5px solid var(--line);
            border-radius: 12px;
            background: var(--raised);
            font-family: var(--display);
            font-weight: 800;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tile[aria-checked="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }

        .tile .ico { width: 14px; height: 14px; color: var(--muted); }

        .dial {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border-radius: 16px;
            background: var(--raised);
        }

        .dial-btn {
            width: 56px;
            height: 56px;
            flex: none;
            border: 1.5px solid var(--line);
            border-radius: 14px;
            background: var(--card);
            font-family: var(--display);
            font-weight: 800;
            font-size: 22px;
        }

        .dial-btn.plus {
            border: none;
            background: var(--accent);
            color: var(--on-accent);
        }

        .dial-val { flex: 1; text-align: center; }
        .dial-val .num { display: block; font-size: 34px; }
        .dial-val small { font-size: 11px; color: var(--muted); }

        .trash {
            width: 44px;
            height: 44px;
            flex: none;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--bad);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .row-between {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .row-between small { font-size: 11px; color: var(--muted); }

        .chip-grid {
            display: grid;
            grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr));
            gap: 8px;
        }

        .chip {
            min-height: 56px;
            border: 1.5px solid var(--accent);
            border-radius: 14px;
            background: transparent;
            color: var(--accent);
            font-family: var(--display);
            font-weight: 800;
            font-size: 24px;
        }

        .chip.used {
            border-color: var(--line);
            color: var(--muted);
            text-decoration: line-through;
        }

        .note {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px dashed var(--line);
            font-size: 12px;
            color: var(--muted);
        }

        .note b { color: var(--text); }

        .switch-row {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 56px;
            border-top: 1px dashed var(--line);
        }

        .switch-row .sec-text b { font-size: 14px; }

        .big-stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .big-stepper .num { font-size: 40px; min-width: 60px; text-align: center; }

        /* Freigespielt-Dialog */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: var(--scrim);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 20px 12px 40px;
        }

        .overlay-panel {
            width: 100%;
            max-width: 560px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px 16px 18px;
        }

        .unlock-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .unlock-head h2 { font-size: 18px; flex: 1; }
        .unlock-actions { display: flex; gap: 8px; margin-top: 10px; }
        .unlock-box { margin-top: 14px; }

        .unlock-box h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .unlock-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 9px 0;
            border-top: 1px solid var(--line);
            cursor: pointer;
        }

        .unlock-row input {
            width: 20px;
            height: 20px;
            margin-top: 1px;
            accent-color: var(--accent);
            flex-shrink: 0;
        }

        .u-name { font-size: 15px; }

        .u-cond {
            display: block;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.35;
        }

        /* Wertungsblatt-Symbole: Füllung mit weißer Kontur */
        .glyph {
            width: 22px;
            height: 22px;
            fill: currentColor;
            stroke: var(--glyph-outline);
            stroke-width: 1.4;
            stroke-linejoin: round;
            paint-order: stroke;
            overflow: visible;
            flex-shrink: 0;
        }

        .glyph.flat { stroke: none; }

        .glyph.line {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            paint-order: normal;
        }

        @media (prefers-reduced-motion: reduce) {
            .flash, .flash-total { animation: none; }
            .bar > span, .switch::after { transition: none; }
        }
    </style>
</head>
<body>
    <div class="app">

    <script>
        'use strict';

        // ── Konfiguration ────────────────────────────────────────
        const STORAGE_KEY = 'dorfromantik-sakura-score_state';
        const UNLOCK_KEY = 'dorfromantik-sakura-score_unlocks';
        const UI_KEY = 'dorfromantik-sakura-score_ui';
        const SIZES_KEY = 'dorfromantik-sakura-score_sizes';
        const CHIPS_46 = [4, 5, 6];
        // Fester Marker-Vorrat: je Typ 2× 4, 5 und 6 (auch Rundumaufträge)
        const SUPPLY_46 = [4, 4, 5, 5, 6, 6];
        // Startwerte der Gebietsgrößen, bis der eigene Verlauf genug hergibt
        const SIZE_SEED = [4, 5, 6];
        const TABS = ['auftraege', 'vorrat', 'wertung'];

        // Alle Erfolge des Kampagnenblatts, nach Schachtel. cond = Freispielbedingung
        const UNLOCKS = [
            { box: 'Schachtel 1', items: [
                { key: 'rundum', name: 'Rundumaufträge', cond: 'Beim Öffnen von Schachtel 1' },
                { key: 'lagerhaus', name: 'Lagerhaus', cond: '4+ erfüllte Rundumaufträge in einer Partie' },
            ] },
            { box: 'Schachtel 2', items: [
                { key: 'see', name: 'See', cond: 'Kampagnenpfad' },
                { key: 'kreuzung', name: 'Straßenkreuzung', cond: 'Kampagnenpfad' },
                { key: 'staudamm', name: 'Staudamm', cond: 'Fluss aus 8+ Plättchen, an beiden Enden abgeschlossen' },

            { box: 'Schachtel 5 · Meisterprüfung', items: [
                { key: 'sDR', name: 'Dorf & Reis', cond: '5+ abgeschlossene Dorfgebiete aus je 2+ Plättchen' },
                { key: 'sKD', name: 'Kirschbaum & Dorf', cond: '5+ abgeschlossene Kirschbaumgebiete aus je 2+ Plättchen' },

            { box: 'Schachtel 6 · Badende Affen', items: [

                { key: 'buntefahne', name: 'Bunte Fahne', cond: '30+ Punkte aus einem abgeschlossenen Fahnengebiet' },

                { key: 'ochsen', name: 'Ochsenkarren & Handelsposten', cond: '200+ Punkte und Straße aus 12+ Plättchen' },
                { key: 'daimyo', name: 'Daimyo', cond: '169+ Punkte durch Aufträge' },
                { key: 'poet', name: 'Poet', cond: '18 Punkte mit Tempeln' },
            ] },
        ];
        const ALL_UNLOCK_KEYS = UNLOCKS.flatMap((b) => b.items.map((i) => i.key));

        // SVG-Symbole nach dem offiziellen Wertungsblatt (viewBox 24×24, gefüllt)

        const taskLimit = () => (isUnlocked('fujiyama') && state.fuji ? 4 : 3);

        // ── Summen ───────────────────────────────────────────────
        function allocateSupply(supply, tally) {

        const cap = (f, n) => (f.max != null && f.kind === 'tally' ? Math.min(n, f.max) : n);
        const fieldTotal = (f, v) => {
            if (f.kind === 'tally') return cap(f, v.reduce((a, b) => a + b, 0));
            if (f.derived) return num(v) > 0 ? flagAreaCount() * f.mult : 0;
